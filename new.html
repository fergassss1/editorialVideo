<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>editorialThing — Ampm</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app" class="app-shell">
    <!-- Floating / Sticky Left Sidebar & Responsive Top Bar -->
    <aside id="sidebar" class="sidebar" aria-label="Primary navigation">
      <div class="sidebar-top">
        <div class="sidebar-brand-row">
          <button id="brandResetBtn" class="brand-logo-btn" type="button" title="Reset view">
            <img src="assets/logo.svg" alt="Ampm" class="brand-logo" />
          </button>
          <button id="mobileNavToggle" class="mobile-nav-toggle" type="button" aria-expanded="false" aria-controls="sidebarCollapsible" title="Toggle menu">
            <span class="sf-icon" data-sf-symbol="line.3.horizontal" aria-hidden="true"></span>
          </button>
        </div>

        <div id="sidebarCollapsible" class="sidebar-collapsible">
          <form id="sidebarSearchForm" class="search-pill" autocomplete="off">
            <span class="sf-icon search-icon" data-sf-symbol="magnifyingglass" aria-hidden="true"></span>
            <input
              id="sidebarSearchInput"
              type="search"
              placeholder="Search catalog..."
              aria-label="Search albums, artists, songs, or playlists"
            />
            <input
              id="storefrontInput"
              type="text"
              class="storefront-mini"
              value="us"
              maxlength="5"
              aria-label="Storefront"
              title="Storefront (e.g. us, gb, jp, es)"
            />
          </form>

          <nav class="nav-list" aria-label="Catalog sections">
            <button type="button" class="nav-item is-active" data-nav="albums">
              <span class="sf-icon nav-icon" data-sf-symbol="rectangle.stack.fill" aria-hidden="true"></span>
              <span>Albums</span>
            </button>
            <button type="button" class="nav-item" data-nav="artists">
              <span class="sf-icon nav-icon" data-sf-symbol="music.mic" aria-hidden="true"></span>
              <span>Artists</span>
            </button>
            <button type="button" class="nav-item" data-nav="playlists">
              <span class="sf-icon nav-icon" data-sf-symbol="music.note.list" aria-hidden="true"></span>
              <span>Playlists</span>
            </button>
          </nav>

          <!-- Lower Sidebar Help Legend -->
          <div class="sidebar-help" aria-label="Usage tips">
            <div class="sidebar-help-q">?</div>
            <p>
              Click any element to open its tool or view.
              Artwork opens hi-res static &amp; animated variants, M3U8/MP4 streams, artist motion, and logos.
              Clicking tracks plays previews; clicking labels copies them.
            </p>
          </div>
        </div>
      </div>
    </aside>

    <!-- Main Content Viewport -->
    <main id="mainView" class="main-view">
      <div id="contentArea" class="content-area"></div>
    </main>
  </div>

  <!-- Artwork, Streams & Editorial Media Modal -->
  <div id="mediaModal" class="modal-backdrop" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-header">
        <div>
          <h2 id="modalTitle" class="modal-title">Artwork &amp; Editorial Media</h2>
          <p id="modalSubtitle" class="modal-subtitle"></p>
        </div>
        <button id="modalCloseBtn" type="button" class="modal-close-btn" aria-label="Close modal">
          <span class="sf-icon" data-sf-symbol="xmark" aria-hidden="true"></span>
        </button>
      </div>
      <div id="modalBody" class="modal-body"></div>
    </div>
  </div>

  <!-- Toast Notification for Clipboard / Actions -->
  <div id="toastBanner" class="toast-banner" role="status" aria-live="polite"></div>

  <!-- Preview Audio Player -->
  <audio id="previewAudio" preload="none"></audio>

  <script src="app.js"></script>
</body>
</html>
